<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7a1d45">
<meta name="description" content="Ανεξάρτητο ευρετήριο των κατευθυντήριων οδηγιών ΕΜΓΕ με σύνοψη συστάσεων, αλγορίθμους και δόσεις.">
<title>Οδηγίες ΜΓ: Ευρετήριο κατευθυντήριων οδηγιών ΕΜΓΕ</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 512 512%22%3E%3Cdefs%3E%3ClinearGradient id=%22g%22 x1=%220%22 y1=%220%22 x2=%221%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%23c2407a%22/%3E%3Cstop offset=%22.5%22 stop-color=%22%238a2552%22/%3E%3Cstop offset=%221%22 stop-color=%22%234b2a7a%22/%3E%3C/linearGradient%3E%3CradialGradient id=%22s%22 cx=%22.25%22 cy=%22.15%22 r=%22.8%22%3E%3Cstop offset=%220%22 stop-color=%22%23fff%22 stop-opacity=%22.25%22/%3E%3Cstop offset=%22.7%22 stop-color=%22%23fff%22 stop-opacity=%220%22/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width=%22512%22 height=%22512%22 rx=%22116%22 fill=%22url%28%23g%29%22/%3E%3Crect width=%22512%22 height=%22512%22 rx=%22116%22 fill=%22url%28%23s%29%22/%3E%3Cpath d=%22M352 388A160 160 0 1 1 404 316%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%2230%22 stroke-linecap=%22round%22/%3E%3Ccircle cx=%22236%22 cy=%22200%22 r=%2250%22 fill=%22%23fff%22/%3E%3Cpath d=%22M196 276c-8 58 26 100 80 100 50 0 80-34 76-74-3-32-28-52-58-50%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%2240%22 stroke-linecap=%22round%22/%3E%3Ccircle cx=%22398%22 cy=%22388%22 r=%2224%22 fill=%22%23ffc8de%22/%3E%3C/svg%3E" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f3f7;--surface:#ffffff;--surface2:#faf8fc;--ink:#1a1b2e;--muted:#646779;--line:#e6e2ec;
  --acc:#7a1d45;--acc2:#a3305f;--accsoft:#f7e9f0;--teal:#0f766e;--tealsoft:#e1f3f0;
  --ok:#15803d;--oksoft:#e3f5e8;--bad:#b42318;--badsoft:#fdecea;--warn:#a15c07;--warnsoft:#fdf3e1;
  --rx:#3b4cca;--rxsoft:#eceffd;
  --r:16px;--sh:0 1px 2px rgba(26,27,46,.04),0 8px 24px rgba(26,27,46,.06);
  --sb:248px;
}
[data-theme="dark"]{
  --bg:#0f1016;--surface:#181a23;--surface2:#1d2029;--ink:#ecebf2;--muted:#9a9cb0;--line:#2a2d3a;
  --acc:#e47aa6;--acc2:#f095bb;--accsoft:#3a1f2c;--teal:#5fd1c2;--tealsoft:#15302d;
  --ok:#5fd38a;--oksoft:#16301f;--bad:#ff8a7e;--badsoft:#3b1d1a;--warn:#f2b864;--warnsoft:#3a2c17;
  --rx:#9fa9ff;--rxsoft:#1f2440;--sh:none;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Commissioner",system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--acc);text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}

/* layout */
.app{display:grid;grid-template-columns:var(--sb) 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;padding:22px 16px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:22px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px;cursor:pointer}
.mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--acc),#c2416f);color:#fff;font-weight:800;display:grid;place-items:center;font-size:15px;letter-spacing:.02em;flex:0 0 auto}
.brand b{font-size:17px;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:12px}
nav.side{display:flex;flex-direction:column;gap:2px}
.nl{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;color:var(--ink);font-weight:500;font-size:15px;cursor:pointer;border:0;background:none;text-align:left;width:100%}
.nl:hover{background:var(--surface2)}
.nl.on{background:var(--accsoft);color:var(--acc);font-weight:600}
.nl svg{width:19px;height:19px;flex:0 0 auto}
.nl .ct{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500}
.sidehead{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:0 12px;margin-bottom:4px}
.sidefoot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 8px;line-height:1.45}
main{min-width:0;padding:0 0 100px}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:14px 32px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid transparent}
.topbar.scrolled{border-bottom-color:var(--line)}
.sbtn{flex:1;max-width:620px;display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:text;font-size:15px;box-shadow:var(--sh);text-align:left}
.num.sm{font-size:12px;letter-spacing:-.2px}
.dhead .num.sm{font-size:15px}
.tag.intl{background:#e8f0fb;color:#1d4f91}
[data-theme=dark] .tag.intl{background:#1d2c44;color:#9cc0f2}
.srcsw{margin:0 0 12px}.srcsw .n{opacity:.65;font-weight:600;margin-left:4px}
.askbox .mic{flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--acc);display:grid;place-items:center;cursor:pointer;align-self:flex-end}
.askbox .mic.on{background:#d33;color:#fff;border-color:#d33;animation:micp 1.2s infinite}
@keyframes micp{0%{box-shadow:0 0 0 0 rgba(221,51,51,.5)}100%{box-shadow:0 0 0 12px rgba(221,51,51,0)}}
.michint{font-size:13px;color:#d33;margin:6px 4px 0;text-align:center}
.sbtn kbd{margin-left:auto}
.sbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
kbd{font-family:inherit;font-size:11.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;color:var(--muted);background:var(--surface2)}
.ibtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.ibtn svg{width:19px;height:19px}
.mobrand{display:none}
.wrap{max-width:1120px;padding:8px 32px 0;margin:0 auto}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--warnsoft);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:13.5px;margin:6px 0 22px}
.notice a{color:inherit;text-decoration:underline}

/* home */
.hero{background:linear-gradient(135deg,var(--acc) 0%,#9e2c5a 55%,#5b2a86 100%);color:#fff;border-radius:24px;padding:34px 34px 30px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero h1{margin:0 0 6px;font-size:30px;line-height:1.15;letter-spacing:-.01em}
.hero p{margin:0 0 20px;opacity:.88;max-width:620px}
.hsearch{position:relative;max-width:640px;z-index:1}
.hsearch input{width:100%;padding:16px 18px 16px 50px;font:inherit;font-size:17px;border:0;border-radius:14px;background:#fff;color:#1a1b2e;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.hsearch svg{position:absolute;left:17px;top:50%;transform:translateY(-50%);color:#7a1d45;width:20px;height:20px}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;position:relative;z-index:1}
.qc{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:6px 13px;font-size:13.5px;cursor:pointer;font-weight:500}
.qc:hover{background:rgba(255,255,255,.22)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0 6px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;box-shadow:var(--sh)}
.stat b{font-size:24px;display:block;line-height:1.1}
.stat span{color:var(--muted);font-size:13px}
h2.sec{font-size:19px;margin:30px 0 12px;display:flex;align-items:center;gap:10px}
h2.sec a{margin-left:auto;font-size:14px;font-weight:600}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ftile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;box-shadow:var(--sh);display:flex;flex-direction:column;gap:6px;transition:transform .12s,border-color .12s;text-align:left}
.ftile:hover{transform:translateY(-2px);border-color:var(--teal)}
.ftile .ico{width:34px;height:34px;border-radius:10px;background:var(--tealsoft);color:var(--teal);display:grid;place-items:center}
.ftile .ico svg{width:18px;height:18px}
.ftile b{font-size:15.5px;line-height:1.3}
.ftile span{color:var(--muted);font-size:13px;line-height:1.4}

/* list rows */
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:4px 0 14px}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;font-size:13.5px;cursor:pointer;display:flex;gap:6px;align-items:center;font-weight:500}
.chip .n{color:var(--muted);font-size:12px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip.on .n{color:rgba(255,255,255,.8)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tools input[type=search]{flex:1 1 260px;padding:11px 14px;font:inherit;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.tgl{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer;user-select:none}
.tgl input{accent-color:var(--acc);width:16px;height:16px}
select{font:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;box-shadow:var(--sh);transition:border-color .12s}
.row:hover{border-color:var(--acc)}
.row.old{opacity:.7;box-shadow:none;background:transparent;border-style:dashed}
.num{flex:0 0 auto;min-width:48px;height:48px;border-radius:12px;background:var(--accsoft);color:var(--acc);display:grid;place-items:center;font-weight:800;font-size:16px;padding:0 6px}
.row.old .num{background:transparent;border:1px solid var(--line);color:var(--muted)}
.rmain{flex:1;min-width:0}
.rt{font-weight:600;font-size:15px;line-height:1.35}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:11.5px;padding:2px 8px;border-radius:6px;background:var(--surface2);color:var(--muted);border:1px solid var(--line);font-weight:500}
.tag.cur{background:var(--oksoft);color:var(--ok);border-color:transparent}
.tag.sup{background:var(--warnsoft);color:var(--warn);border-color:transparent}
.tag.alg{background:var(--tealsoft);color:var(--teal);border-color:transparent}
.star{background:none;border:0;cursor:pointer;color:var(--muted);padding:6px;line-height:0;border-radius:10px}
.star:hover{background:var(--surface2)}
.star.on{color:#d49a12}
.chev{color:var(--muted);flex:0 0 auto}
mark{background:#ffe27a;color:#1a1b2e;border-radius:3px;padding:0 1px}
.empty{text-align:center;color:var(--muted);padding:50px 0}

/* detail */
.back{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px;cursor:pointer;background:none;border:0;color:var(--acc);padding:6px 0;margin-bottom:8px}
.dhead{display:flex;gap:18px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--sh)}
.dhead .num{min-width:64px;height:64px;font-size:22px;border-radius:16px}
.dhead h1{font-size:24px;line-height:1.25;margin:0 0 8px;letter-spacing:-.01em}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:14px;padding:10px 15px;border-radius:11px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.tl{background:var(--tealsoft);border-color:transparent;color:var(--teal)}
.btn svg{width:16px;height:16px}
.rel{margin-top:12px;font-size:14px;color:var(--muted)}
.rel a{cursor:pointer;font-weight:600}
.recs{counter-reset:r;display:flex;flex-direction:column;gap:10px;margin-top:6px}
.rec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px 14px 54px;position:relative;font-size:15px;line-height:1.55}
.rec:before{counter-increment:r;content:counter(r);position:absolute;left:14px;top:13px;width:28px;height:28px;border-radius:9px;background:var(--accsoft);color:var(--acc);display:grid;place-items:center;font-weight:700;font-size:13.5px}
.verify{font-size:13px;color:var(--muted);margin:12px 0 0;display:flex;gap:8px;align-items:flex-start}

/* flowchart */
.flow{display:flex;flex-direction:column;align-items:stretch;max-width:860px}
.node{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--sh);position:relative}
.node h3{margin:0 0 6px;font-size:15.5px;display:flex;align-items:center;gap:8px}
.node h3 .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:6px;font-weight:700}
.node ul{margin:0;padding-left:18px;font-size:14.5px;line-height:1.55}
.node li{margin:3px 0}
.node.rx{border-color:color-mix(in srgb,var(--rx) 35%,var(--line));background:linear-gradient(0deg,var(--surface),var(--surface)),var(--rxsoft)}
.node.rx{border-left:5px solid var(--rx)}
.node.rx h3 .k{background:var(--rxsoft);color:var(--rx)}
.node.rx ul{list-style:none;padding-left:0}
.node.rx li{padding:5px 0;border-bottom:1px dashed var(--line);font-weight:500}
.node.rx li:last-child{border-bottom:0}
.node.warn{border-left:5px solid var(--warn);background:var(--warnsoft)}
.node.warn h3 .k{background:var(--surface);color:var(--warn)}
.node.end{border-left:5px solid var(--ok)}
.node.end h3 .k{background:var(--oksoft);color:var(--ok)}
.node.step{border-left:5px solid var(--acc)}
.node.step h3 .k{background:var(--accsoft);color:var(--acc)}
.node.dec{border:2px solid var(--teal);background:var(--surface)}
.node.dec>h3{color:var(--teal);font-size:16px}
.node.dec>h3 .k{background:var(--tealsoft);color:var(--teal)}
.branches{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-top:10px}
.br{border-radius:12px;padding:10px 12px;background:var(--surface2);border:1px solid var(--line);font-size:14px}
.br b{display:block;font-size:14px;margin-bottom:4px}
.br.ok{background:var(--oksoft);border-color:transparent}
.br.ok b{color:var(--ok)}
.br.bad{background:var(--badsoft);border-color:transparent}
.br.bad b{color:var(--bad)}
.br ul{padding-left:16px;font-size:13.5px}
.conn{height:22px;width:2px;background:var(--line);margin:0 auto;position:relative}
.conn:after{content:"";position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--muted);border-bottom:0}
.nref{font-size:12px;color:var(--muted);margin-top:6px}
.nref a{cursor:pointer;font-weight:600}
.fhead{display:flex;gap:16px;align-items:flex-start;margin-bottom:16px}
.fhead .ico{width:52px;height:52px;border-radius:14px;background:var(--tealsoft);color:var(--teal);display:grid;place-items:center;flex:0 0 auto}
.fhead h1{margin:0;font-size:24px;line-height:1.2}
.fhead p{margin:4px 0 0;color:var(--muted)}

/* doses */
.dgrp{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;box-shadow:var(--sh)}
.dgrp h3{margin:0 0 6px;font-size:14.5px;display:flex;gap:8px;align-items:center;cursor:pointer}
.dgrp h3 .num{min-width:34px;height:34px;font-size:13px;border-radius:9px}
.dgrp ul{margin:0;padding-left:18px;font-size:14px}
.dgrp li{margin:4px 0}

/* palette */
.pal{position:fixed;inset:0;z-index:50;background:rgba(15,16,22,.45);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;padding:10vh 16px 16px}
.pal.open{display:flex}
.pbox{width:100%;max-width:680px;background:var(--surface);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden;border:1px solid var(--line)}
.pin{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.pin input{flex:1;border:0;outline:0;font:inherit;font-size:17px;background:transparent;color:var(--ink)}
.pin svg{color:var(--muted);width:20px;height:20px}
.pres{max-height:60vh;overflow:auto;padding:6px}
.pg{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:10px 10px 4px}
.pi{display:flex;gap:12px;align-items:center;padding:9px 10px;border-radius:11px;cursor:pointer}
.pi.sel,.pi:hover{background:var(--accsoft)}
.pi .num{min-width:36px;height:36px;font-size:13px;border-radius:10px}
.pi .ico{width:36px;height:36px;border-radius:10px;background:var(--tealsoft);color:var(--teal);display:grid;place-items:center;flex:0 0 auto}
.pi .ico svg{width:17px;height:17px}
.pi .pt{font-weight:600;font-size:14.5px;line-height:1.3}
.pi .ps{font-size:12.5px;color:var(--muted);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.phint{display:flex;gap:14px;padding:9px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}

/* interactive */
.dec .br{cursor:pointer;transition:opacity .15s,transform .1s}
.dec .br:active{transform:scale(.98)}
.dec.picked .br{opacity:.38}
.dec.picked .br.pick{opacity:1;outline:2.5px solid var(--teal);outline-offset:1px}
.tapnote{display:block;font-size:12.5px;color:var(--teal);font-weight:500;margin:-2px 0 2px}
.bn{color:var(--rx);font-weight:600;font-size:.93em;white-space:normal}
.node.rx .bn{font-weight:600}
.reset{font-size:12.5px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 9px;cursor:pointer;margin-left:auto}
.cpy{margin-left:auto;font-size:12.5px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 10px;cursor:pointer;color:var(--rx);font-weight:600}
.howto{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 18px;position:relative;box-shadow:var(--sh)}
.howto div{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.howto b{display:block}
.howto .st{width:28px;height:28px;border-radius:50%;background:var(--accsoft);color:var(--acc);display:grid;place-items:center;font-weight:800;flex:0 0 auto}
.howto .x{position:absolute;top:8px;right:10px;border:0;background:none;cursor:pointer;color:var(--muted);font-size:18px}
.tools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;align-items:start}
.calc{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--sh)}
.calc h3{margin:0 0 4px;font-size:17px}
.calc p.d{margin:0 0 12px;color:var(--muted);font-size:13.5px}
.calc label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px;color:var(--muted)}
.calc input,.calc select{width:100%;padding:11px 12px;font:inherit;border:1px solid var(--line);border-radius:11px;background:var(--surface2);color:var(--ink)}
.seg{display:flex;flex-wrap:wrap;gap:6px}

.secrow{display:flex;align-items:center;gap:12px;margin:30px 0 14px;flex-wrap:wrap}

.gflow{max-width:760px}

/* ===== v9 modern ===== */

:root{--r:18px;--sh:0 1px 2px rgba(26,27,46,.04),0 10px 30px -12px rgba(26,27,46,.14)}

button{-webkit-tap-highlight-color:transparent}

.hx{max-width:1080px}

.hx-ai:after{content:"";position:absolute;right:-40px;top:-50px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.09)}
.hx-ai-ic{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:0 0 auto}
.hx-ai-t{flex:1;min-width:0}.hx-ai-t b{display:block;font-size:18px}.hx-ai-t small{opacity:.85;font-size:13.5px}
.hx-go{opacity:.8}
.hx-sec{display:flex;align-items:baseline;justify-content:space-between;font-size:18px;margin:26px 2px 12px;letter-spacing:-.01em}
.hx-sec a{font-size:14px;font-weight:600}
.hx-em{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hx-emt{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;border:1px solid color-mix(in srgb,var(--c) 22%,var(--line));background:color-mix(in srgb,var(--c) 7%,var(--surface));cursor:pointer;text-align:left;font-weight:600;font-size:15px;color:var(--ink);min-height:70px}
.hx-emi{width:42px;height:42px;border-radius:13px;background:var(--c);color:#fff;display:grid;place-items:center;flex:0 0 auto}

.hx-row,.hx-car{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
.hx-row::-webkit-scrollbar,.hx-car::-webkit-scrollbar{display:none}
.hx-chip{flex:0 0 auto;display:flex;align-items:center;gap:8px;max-width:260px;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px;scroll-snap-align:start}
.hx-chip b{color:var(--acc);font-size:12.5px}.hx-chip svg{color:var(--teal);flex:0 0 auto}
.hx-chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hx-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}

.hx-sc b{font-size:14.5px;line-height:1.2}.hx-sc small{color:var(--muted);font-size:12.5px;font-weight:600}

.hx-sc:nth-child(3) .hx-sci{background:#e8f0fb;color:#1d4f91}
.hx-sc:nth-child(4) .hx-sci{background:var(--rxsoft);color:var(--rx)}
.hx-sc:nth-child(5) .hx-sci{background:var(--warnsoft);color:var(--warn)}
[data-theme=dark] .hx-sc:nth-child(3) .hx-sci{background:#1d2c44;color:#9cc0f2}
.hx-fc{flex:0 0 230px;display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;box-shadow:var(--sh);scroll-snap-align:start}

.fab{display:none}
@media (hover:hover){.hx-sc:hover,.hx-fc:hover,.hx-emt:hover{transform:translateY(-2px);box-shadow:0 14px 30px -14px rgba(26,27,46,.25)}}
@media (max-width:900px){
  .hx-h{font-size:27px}

}

/* ===== v10 calm ===== */
.hx-em>*,.hx-grid>*{min-width:0}
.hx-emt span:nth-child(2){min-width:0;overflow-wrap:anywhere;line-height:1.3}
@media (max-width:900px){.chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-right:-14px;padding-right:14px}.chips::-webkit-scrollbar{display:none}.chip{flex:0 0 auto}.hx-emt{font-size:14px;gap:10px;padding:10px 12px}.hx-arr{display:none}}
:root{
  --bg:#f6f6f4;--surface:#ffffff;--surface2:#f3f3f1;--ink:#17181c;--muted:#6e717a;--line:#e8e8e5;
  --acc:#8a2552;--acc2:#a3305f;--accsoft:#f5ecf0;--teal:#2f6f68;--tealsoft:#eaf2f0;
  --ok:#2f7a4b;--oksoft:#ecf5ef;--bad:#b4372c;--badsoft:#fbefed;--warn:#9a6212;--warnsoft:#faf3e6;
  --rx:#3f4fb8;--rxsoft:#eff1fb;--r:16px;--sh:none}
[data-theme="dark"]{--bg:#121316;--surface:#1a1b1f;--surface2:#202126;--ink:#ececee;--muted:#9b9da6;--line:#2a2b31;--accsoft:#33202a;--sh:none}
html,body{font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.6;letter-spacing:-.005em;font-feature-settings:"cv11","ss01"}
h1,h2,h3{letter-spacing:-.02em}
aside{background:var(--bg);border-right:1px solid var(--line)}
.mark{background:var(--ink);border-radius:10px}
[data-theme=dark] .mark{background:var(--acc)}
.nl{font-weight:500;color:var(--muted)}
.nl:hover{background:var(--surface)}
.nl.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.nl.on svg{color:var(--acc)}
.sbtn{border-radius:12px;background:var(--surface);box-shadow:none}
.ibtn{border-radius:12px}
.row,.ftile,.stat,.dhead,.node,.rec,.dgrp,.hx-sc,.hx-fc,.hx-emt,.calc,.askbox{box-shadow:none!important}
.row{border-radius:14px;padding:14px 16px}
.row:hover{border-color:#d5d5d1}
.num{background:var(--surface2);color:var(--ink);border-radius:12px;font-weight:700}
.tag{background:transparent;border:0;padding:0;color:var(--muted);font-size:12.5px}
.tag+.tag:before{content:"·";margin-right:6px;color:#c4c4c0}
.tag.cur,.tag.alg,.tag.intl{background:transparent;color:var(--teal);font-weight:600}
.tag.intl{color:#3b5f9a}.tag.sup{background:transparent;color:var(--warn);font-weight:600}
.meta{gap:6px}
.chip{background:transparent;border-color:var(--line)}
.chip.on{background:var(--ink);border-color:var(--ink)}
[data-theme=dark] .chip.on{background:var(--ink);color:var(--bg)}
.btn{border-radius:12px;font-weight:600}
.btn.pri{background:var(--ink);border-color:var(--ink)}
[data-theme=dark] .btn.pri{background:var(--acc);border-color:var(--acc)}
.btn.tl{background:var(--surface2);color:var(--ink)}
/* calmer flow nodes */
.node{border-radius:16px;border:1px solid var(--line)!important;background:var(--surface)!important;padding:16px 18px}
.node.rx,.node.warn,.node.end,.node.step{border-left:1px solid var(--line)!important}
.node:before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:3px;border-radius:0 3px 3px 0;background:var(--line)}
.node.rx:before{background:var(--rx)}.node.warn:before{background:var(--warn)}.node.end:before{background:var(--ok)}.node.step:before{background:#c9c9c4}.node.dec:before{background:var(--teal)}
.node h3 .k{background:transparent!important;padding:0;font-size:10.5px;letter-spacing:.09em;color:var(--muted)!important;font-weight:600}
.node.rx h3 .k{color:var(--rx)!important}.node.warn h3 .k{color:var(--warn)!important}.node.dec h3 .k{color:var(--teal)!important}
.node.dec>h3{color:var(--ink)}
.node.warn{background:color-mix(in srgb,var(--warnsoft) 55%,var(--surface))!important}
.gnode li:before{width:5px;height:5px;top:17px;background:#b9b9b4}
.gnode.rx li:before{background:var(--rx)}.gnode.warn li:before{background:var(--warn)}
.gnode li,.node.rx li{border-top-style:solid;border-color:#f0f0ed}
[data-theme=dark] .gnode li,[data-theme=dark] .node.rx li{border-color:var(--line)}
.gidx{background:transparent!important;color:#b0b0ab!important;border:0!important}
.br{background:var(--surface2);border:1px solid transparent;border-radius:12px}
.br.ok{background:var(--oksoft)}.br.bad{background:var(--badsoft)}
.conn{background:#dcdcd8;height:18px;width:1px}
.conn:after{display:none}
.nm{background:transparent!important;color:inherit!important;font-weight:700;padding:0}
.node.rx .nm{color:var(--rx)!important}
.verify{color:var(--muted)}
/* home calm */
.hx-h{font-size:34px;font-weight:700}
.hx-search{border-radius:16px;box-shadow:0 1px 0 rgba(0,0,0,.02),0 8px 24px -16px rgba(0,0,0,.18)}
.hx-mic{background:var(--ink);box-shadow:none}
[data-theme=dark] .hx-mic{background:var(--acc)}

.hx-ai:after{display:none}
[data-theme=dark] .hx-ai{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.hx-ai-ic{background:rgba(255,255,255,.1);color:#f3c6da}
.hx-sec{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:32px 2px 12px}
.hx-sec a{text-transform:none;letter-spacing:0;font-size:13.5px}
.hx-emt{background:var(--surface)!important;border:1px solid var(--line)!important;border-radius:14px;min-height:60px;font-weight:600;font-size:15px;padding:12px 14px}
.hx-emi{background:var(--accsoft);color:var(--acc);width:36px;height:36px;border-radius:10px}
.hx-arr{margin-left:auto;color:#b9b9b4;display:flex}
.hx-sci{background:var(--surface2)!important;color:var(--ink)!important;border-radius:12px}
.hx-sc{border-radius:16px}
.hx-fci{background:var(--surface2);color:var(--ink)}
.hx-fc{border-radius:16px}
.hx-chip b{color:var(--muted)}.hx-chip svg{color:var(--muted)}
.fab{background:var(--ink)!important;box-shadow:0 10px 24px -10px rgba(0,0,0,.5)!important}
[data-theme=dark] .fab{background:var(--acc)!important}
@media (hover:hover){.hx-sc:hover,.hx-fc:hover,.hx-emt:hover,.row:hover{transform:none;box-shadow:none;border-color:#cfcfca!important}}
@media (max-width:900px){
  .hx-h{font-size:28px}
  .tabbar{background:color-mix(in srgb,var(--bg) 90%,transparent)}
  .tabbar button.on{color:var(--ink)}
  .tabbar button.on svg{background:var(--surface);box-shadow:0 0 0 1px var(--line);color:var(--acc)}
  .hx-em{grid-template-columns:1fr 1fr}
}

/* ===== v11 interactive flows + livelier ===== */
.fx-hero{position:relative;overflow:hidden;border-radius:24px;padding:22px 22px 16px;margin:4px 0 16px;color:var(--ink);
  background:radial-gradient(120% 140% at 100% 0%,color-mix(in srgb,var(--cc) 22%,transparent) 0%,transparent 55%),radial-gradient(90% 120% at 0% 100%,color-mix(in srgb,var(--cc) 12%,transparent) 0%,transparent 60%),var(--surface);border:1px solid color-mix(in srgb,var(--cc) 18%,var(--line))}
.fx-badge{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--cc),color-mix(in srgb,var(--cc) 60%,#000));box-shadow:0 10px 22px -10px var(--cc);margin-bottom:12px}
.fx-hero h1{margin:0;font-size:26px;line-height:1.15;letter-spacing:-.02em}
.fx-hero p{margin:6px 0 0;color:var(--muted)}
.fx-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.fx-ref{display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:13px;font-weight:600;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 80%,transparent);color:var(--ink);cursor:pointer;text-decoration:none}
.fx-mode{display:flex;gap:4px;margin-top:16px;padding:4px;border-radius:14px;background:color-mix(in srgb,var(--ink) 6%,transparent);width:max-content;max-width:100%}
.fx-mode button{display:flex;align-items:center;gap:6px;font:inherit;font-size:14px;font-weight:600;border:0;background:none;padding:8px 14px;border-radius:10px;cursor:pointer;color:var(--muted)}
.fx-mode button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
/* wizard */
.wz{max-width:760px}
.wz-prog{display:flex;align-items:center;gap:12px;margin:2px 0 14px}
.wz-bar{flex:1;height:8px;border-radius:99px;background:color-mix(in srgb,var(--ink) 8%,transparent);overflow:hidden}
.wz-bar span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc),#c2457d,#7c5cd6);transition:width .4s cubic-bezier(.2,.7,.2,1)}
.wz-pc{font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.wz-trail{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.wz-tr{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;font-size:14px;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 70%,transparent);cursor:pointer;color:var(--muted)}
.wz-ck{width:22px;height:22px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;flex:0 0 auto}
.wz-th{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wz-tv{font-weight:700;color:var(--ink);background:var(--surface2);padding:2px 9px;border-radius:99px;font-size:13px;max-width:45%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wz-card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;animation:wzin .35s cubic-bezier(.2,.7,.2,1);box-shadow:0 18px 40px -28px rgba(30,20,60,.35)}
@keyframes wzin{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
.wz-k{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.wz-k a{text-transform:none;letter-spacing:0}
.wz-k .cpy{margin-left:auto}
.wz-card.rx .wz-k{color:var(--rx)}.wz-card.warn .wz-k{color:var(--warn)}.wz-card.dec .wz-k{color:var(--teal)}.wz-card.end .wz-k{color:var(--ok)}
.wz-card.rx{border-color:color-mix(in srgb,var(--rx) 30%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--rxsoft) 70%,var(--surface)),var(--surface) 60%)}
.wz-card.warn{border-color:color-mix(in srgb,var(--warn) 30%,var(--line));background:linear-gradient(180deg,var(--warnsoft),var(--surface) 70%)}
.wz-card h2{margin:0 0 12px;font-size:22px;line-height:1.25;letter-spacing:-.02em}
.wz-card ul{margin:0;padding:0;list-style:none}
.wz-card li{position:relative;padding:9px 0 9px 26px;border-top:1px solid color-mix(in srgb,var(--line) 70%,transparent);font-size:16px;line-height:1.55}
.wz-card li:first-child{border-top:0}
.wz-card li:before{content:"";position:absolute;left:6px;top:18px;width:8px;height:8px;border-radius:50%;background:var(--acc);opacity:.75}
.wz-card.rx li:before{background:var(--rx);opacity:1}.wz-card.warn li:before{background:var(--warn);opacity:1}
.wz-card.rx .nm{color:var(--rx)!important}
.wz-opts{display:flex;flex-direction:column;gap:8px}
.wz-opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;font-size:16px;font-weight:600;padding:14px 14px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;transition:all .15s}
.wz-opt:hover{border-color:color-mix(in srgb,var(--acc) 45%,var(--line));transform:translateX(2px)}
.wz-l{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:800;background:var(--surface2);color:var(--muted);flex:0 0 auto}
.wz-ot{flex:1}
.wz-ar{color:#b9b9b4;display:flex}
.wz-opt.on{border-color:var(--acc);background:color-mix(in srgb,var(--accsoft) 70%,var(--surface))}
.wz-opt.on .wz-l{background:var(--acc);color:#fff}.wz-opt.on .wz-ar{color:var(--acc)}
.wz-opt.bad.on{border-color:var(--bad);background:var(--badsoft)}.wz-opt.bad.on .wz-l{background:var(--bad)}.wz-opt.bad.on .wz-ar{color:var(--bad)}
.wz-opt.ok.on{border-color:var(--ok);background:var(--oksoft)}.wz-opt.ok.on .wz-l{background:var(--ok)}.wz-opt.ok.on .wz-ar{color:var(--ok)}
.wz-ans{margin-top:14px;padding:14px 16px;border-radius:16px;background:color-mix(in srgb,var(--accsoft) 60%,var(--surface));animation:wzin .3s ease}
.wz-ans.bad{background:var(--badsoft)}.wz-ans.ok{background:var(--oksoft)}
.wz-al{font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:2px}
.wz-ans li{border-color:rgba(0,0,0,.06)}
.wz-nav{display:flex;justify-content:space-between;gap:10px;margin-top:14px;position:sticky;bottom:calc(72px + env(safe-area-inset-bottom));z-index:5}
.wz-nav .btn{padding:13px 18px;font-size:15px;border-radius:14px;box-shadow:0 8px 20px -12px rgba(0,0,0,.35)}
.wz-nav .btn[disabled]{opacity:.4;cursor:default}
.wz-next{flex:1;justify-content:center}
.wz-card.fin{text-align:center}
.wz-fic{width:58px;height:58px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--ok),#46b07a);box-shadow:0 12px 26px -12px var(--ok)}
.wz-sum{text-align:left;white-space:pre-wrap;font:14px/1.55 "Inter",system-ui,sans-serif;background:var(--surface2);border-radius:14px;padding:14px;margin:10px 0 14px;max-height:340px;overflow:auto}
.wz-card.fin .acts{justify-content:center}
/* diagram */
.dg{position:relative;max-width:820px;padding-left:4px}
.dg:before{content:"";position:absolute;left:21px;top:20px;bottom:20px;width:2px;background:linear-gradient(var(--acc),#7c5cd6);opacity:.25;border-radius:2px}
.dg-n{position:relative;display:flex;gap:14px;margin-bottom:14px}
.dg-dot{flex:0 0 auto;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--surface);border:2px solid var(--line);color:var(--muted);z-index:1;margin-top:10px}
.dg-n.dec .dg-dot{border-color:var(--teal);color:var(--teal)}.dg-n.rx .dg-dot{border-color:var(--rx);color:var(--rx)}.dg-n.warn .dg-dot{border-color:var(--warn);color:var(--warn)}.dg-n.end .dg-dot{border-color:var(--ok);color:var(--ok)}
.dg-card{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.dg-n.rx .dg-card{background:linear-gradient(180deg,color-mix(in srgb,var(--rxsoft) 60%,var(--surface)),var(--surface))}
.dg-n.warn .dg-card{background:var(--warnsoft)}
.dg-k{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.dg-k a{text-transform:none;letter-spacing:0}.dg-k .cpy{margin-left:auto}
.dg-card h3{margin:4px 0 8px;font-size:17px;line-height:1.3}
.dg-card ul{margin:0;padding-left:18px;font-size:15px;line-height:1.6}
.dg-opts{display:flex;flex-wrap:wrap;gap:6px}
.dg-opt{font:inherit;font-size:14px;font-weight:600;padding:8px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink)}
.dg-opt.on{background:var(--ink);border-color:var(--ink);color:#fff}
.dg-opt.bad.on{background:var(--bad);border-color:var(--bad)}.dg-opt.ok.on{background:var(--ok);border-color:var(--ok)}
[data-theme=dark] .dg-opt.on{color:var(--bg)}
.dg-ans{margin-top:10px;padding:10px 14px;border-radius:14px;background:var(--surface2);animation:wzin .25s ease}
.dg-ans.bad{background:var(--badsoft)}.dg-ans.ok{background:var(--oksoft)}
.dg-hint{margin-top:8px;font-size:13px;color:var(--muted)}
/* livelier: algorithm tiles + home */
.ftile{position:relative;overflow:hidden;border-radius:20px!important;padding:18px!important}
.ftile .ico{width:42px!important;height:42px!important;border-radius:13px!important;color:#fff!important;background:linear-gradient(135deg,var(--cc,#7c5cd6),color-mix(in srgb,var(--cc,#7c5cd6) 60%,#000))!important;box-shadow:0 8px 18px -10px var(--cc,#7c5cd6)}
.ftile:after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:color-mix(in srgb,var(--cc,#7c5cd6) 10%,transparent)}
.ftile:hover{border-color:color-mix(in srgb,var(--cc,#7c5cd6) 50%,var(--line))!important}
.hx-top{position:relative;padding:22px 18px 20px!important;margin:4px 0 0;border-radius:26px;background:radial-gradient(90% 130% at 100% 0%,rgba(194,69,125,.20),transparent 60%),radial-gradient(80% 120% at 0% 100%,rgba(124,92,214,.16),transparent 60%),var(--surface);border:1px solid var(--line)}
.hx-fci{background:linear-gradient(135deg,var(--cc,#7c5cd6),color-mix(in srgb,var(--cc,#7c5cd6) 60%,#000))!important;color:#fff!important}
.hx-ai{background:linear-gradient(120deg,#1d1b2a,#3a2346 60%,#5a2a5e)!important}
.hx-emi{background:linear-gradient(135deg,#c2457d,#8a2552)!important;color:#fff!important}
@media (max-width:900px){.fx-hero{padding:18px 16px 14px;border-radius:20px}.fx-hero h1{font-size:22px}.wz-card{padding:18px 16px;border-radius:20px}.wz-card h2{font-size:20px}.fx-mode{width:100%}.fx-mode button{flex:1;justify-content:center;padding:9px 8px;font-size:13.5px}}
.bnm{font:inherit;font-size:11.5px;font-weight:700;border:0;border-radius:99px;padding:1px 7px;margin-left:2px;background:color-mix(in srgb,var(--acc) 12%,transparent);color:var(--acc);cursor:pointer;vertical-align:1px}
.bnx{font-weight:inherit}
.mark{background:none!important;padding:0;overflow:hidden;border-radius:11px}.mark svg{display:block}
[data-theme=dark] .mark{background:none!important}

/* ===== staging ===== */
.gmob{display:none}
.gwrap{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:22px;align-items:start}
.gmain{min-width:0}
.stg{position:sticky;top:84px;max-height:calc(100vh - 100px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 18px 40px -30px rgba(30,20,60,.35);scrollbar-width:thin}
.stg-h{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.stg-h b{display:block;font-size:16px}.stg-h small{display:block;color:var(--muted);font-size:12px;line-height:1.35}
.stg-ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#3b78d8,#5b2a86);flex:0 0 auto}
.stg-tabs{display:flex;gap:4px;padding:3px;border-radius:12px;background:color-mix(in srgb,var(--ink) 6%,transparent);margin-bottom:10px}
.stg-tabs button{flex:1;font:inherit;font-size:13px;font-weight:600;border:0;background:none;padding:7px 8px;border-radius:9px;cursor:pointer;color:var(--muted)}
.stg-tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.stg-g{margin-top:10px}
.stg-gh{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:0 0 6px;line-height:1.35}
.stg-r{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid color-mix(in srgb,var(--line) 70%,transparent);font-size:14px;line-height:1.45}
.stg-g .stg-r:first-of-type{border-top:0}
.stg-c{flex:0 0 auto;min-width:52px;text-align:center;font-weight:800;font-size:12.5px;padding:3px 7px;border-radius:8px;background:var(--surface2);color:var(--ink);white-space:nowrap}
.stg-c.s0{background:#eef2f7;color:#425066}
.stg-c.s1{background:#e5f4ea;color:#256b3f}.stg-c.s2{background:#fdf3d8;color:#8a5a00}.stg-c.s3{background:#fde6d6;color:#a3470e}.stg-c.s4{background:#fbe1e1;color:#a52626}
.stg-c.tnm{background:#e8f0fb;color:#1d4f91}
[data-theme=dark] .stg-c.s1{background:#1d3326;color:#8fd3a8}[data-theme=dark] .stg-c.s2{background:#3a3018;color:#f0cf7a}[data-theme=dark] .stg-c.s3{background:#3d2618;color:#f4ad7f}[data-theme=dark] .stg-c.s4{background:#3d1d1d;color:#f29a9a}[data-theme=dark] .stg-c.tnm{background:#1d2c44;color:#9cc0f2}[data-theme=dark] .stg-c.s0{background:#252a33;color:#b8c2d1}
.stg-d{flex:1;min-width:0}
.stg-note{display:flex;gap:6px;font-size:12px;color:var(--muted);margin:12px 0 0;line-height:1.45}.stg-note svg{flex:0 0 auto;margin-top:2px}
@media (max-width:1180px){
  .gwrap{display:block}
  .stg{position:static;max-height:none;overflow:visible}
  .gmob{display:flex;gap:4px;padding:4px;border-radius:14px;background:color-mix(in srgb,var(--ink) 6%,transparent);margin:18px 0 6px}
  .gmob button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-size:14px;font-weight:600;border:0;background:none;padding:9px;border-radius:10px;cursor:pointer;color:var(--muted)}
  .gmob button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .gwrap.t-rec .stg{display:none}
  .gwrap.t-stg .gmain{display:none}
}

/* ===== back button + pregnancy cards ===== */
.gback{flex:0 0 auto}
.hx-duo{display:flex;gap:10px;max-width:680px;margin:10px 0 0}
.hx-pg{flex:1;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(120deg,color-mix(in srgb,#d9487a 10%,var(--surface)),var(--surface));cursor:pointer;text-align:left;color:var(--ink);font:inherit}
.hx-pg .hx-ai-t small{color:var(--muted)}
.hx-pgi{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#d9487a,#8a2552);flex:0 0 auto}
.hx-new{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:92px;border-radius:18px;border:1.5px dashed color-mix(in srgb,var(--acc) 40%,var(--line));background:var(--surface);color:var(--acc);font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.pg-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:6px 0 12px}
.pg-head h1{margin:0;font-size:28px;letter-spacing:-.02em}.pg-head p{margin:4px 0 0;color:var(--muted)}
.btn.big{padding:12px 18px;font-size:15px;border-radius:14px}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.pg-priv{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--oksoft);color:var(--ink);font-size:14px;line-height:1.5;margin-bottom:14px}.pg-priv svg{color:var(--ok);flex:0 0 auto;margin-top:2px}
.pg-list{display:flex;flex-direction:column;gap:10px;max-width:820px}
.pg-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;color:var(--ink);padding:14px 16px;border-radius:18px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.pg-card>svg{color:#b9b9b4;flex:0 0 auto}
.pg-av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:17px;color:#fff;background:linear-gradient(135deg,#d9487a,#7c5cd6);flex:0 0 auto}
.pg-av.lg{width:58px;height:58px;font-size:22px}
.pg-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.pg-m b{font-size:16.5px}.pg-m small{color:var(--muted);font-size:13.5px}
.pg-ga{font-weight:700;color:var(--acc)}
.pg-nx{color:var(--ink)!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg-fl{min-width:24px;height:24px;border-radius:99px;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;background:var(--warn)}.pg-fl.bad{background:var(--bad)}
.pg-empty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:40px 20px;border:1.5px dashed var(--line);border-radius:20px;color:var(--muted);text-align:center}.pg-empty svg{color:var(--acc)}.pg-empty b{color:var(--ink)}
.pg-io{margin-top:18px}
.pg-top{background:radial-gradient(100% 140% at 100% 0%,rgba(217,72,122,.14),transparent 60%),var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;margin:4px 0 12px}
.pg-id{display:flex;gap:14px;align-items:center}.pg-id h1{margin:0;font-size:24px;letter-spacing:-.02em}.pg-id small{color:var(--muted)}
.pg-kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.pg-kpi div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}.pg-kpi small{display:block;color:var(--muted);font-size:12px}.pg-kpi b{font-size:20px;letter-spacing:-.01em}
.pg-bar{position:relative;height:8px;border-radius:99px;background:color-mix(in srgb,var(--ink) 8%,transparent);margin-top:14px;overflow:visible}
.pg-bar span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#d9487a,#7c5cd6)}
.pg-bar i{position:absolute;top:-3px;width:2px;height:14px;background:var(--surface);border-radius:2px}
.pg-src{display:block;color:var(--muted);font-size:12px;margin-top:6px}
.pg-tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:4px;border-radius:14px;background:color-mix(in srgb,var(--ink) 6%,transparent);margin-bottom:14px;position:sticky;top:70px;z-index:6;backdrop-filter:blur(10px)}
.pg-tabs::-webkit-scrollbar{display:none}
.pg-tabs button{flex:1 0 auto;font:inherit;font-size:14px;font-weight:600;border:0;background:none;padding:9px 14px;border-radius:10px;cursor:pointer;color:var(--muted);white-space:nowrap}
.pg-tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.pg-sec{font-size:18px;margin:18px 2px 10px}.pg-sec small{font-weight:500;color:var(--muted);font-size:13px}
.pg-flags{display:flex;flex-direction:column;gap:8px}
.pg-flag{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;font-size:14.5px;font-weight:600;padding:12px 14px;border-radius:14px;border:0;cursor:pointer;color:var(--ink)}
.pg-flag span{flex:1}.pg-flag.warn{background:var(--warnsoft)}.pg-flag.warn svg:first-child{color:var(--warn)}.pg-flag.bad{background:var(--badsoft)}.pg-flag.bad svg:first-child{color:var(--bad)}
.pg-sched{display:flex;flex-direction:column;gap:8px;max-width:860px}
.pg-it{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.pg-it input{position:absolute;opacity:0;pointer-events:none}

S["77"]={d:"Νοέμβριος 2025",b:[

S["53"]={d:"Ιούλιος 2021",b:[

S["37"]={d:"Σεπτέμβριος 2020",b:[

S["44"]={d:"Μάρτιος 2021",b:[
"Υποψήφιες: μία προηγούμενη χαμηλή εγκάρσια τομή, μονήρης τελειόμηνη κύηση ≥37+0, κεφαλική προβολή, ανεξαρτήτως προηγούμενου κολπικού τοκετού.",
"Η δίδυμη κύηση δεν αποτελεί αντένδειξη· ο εξωτερικός μετασχηματισμός δεν αντενδείκνυται.",
"Μεσοδιάστημα <18 μηνών: ενημέρωση για περίπου τριπλάσιο κίνδυνο ρήξης μήτρας.",
"Αντενδείξεις: κάθετη ή ανεστραμμένη Τ τομή, μυομεκτομή με διάνοιξη κοιλότητας, προηγούμενη ρήξη, γενικές αντενδείξεις (π.χ. προδρομικός).",
"Επιτυχία 72–75%· ρήξη μήτρας περίπου 0,5% (1/200). Οριστική απόφαση ιδανικά στις 36–37 εβδομάδες.",
"Πρόκληση: ωκυτοκίνη αν Bishop >6 (ρήξη ~0,63%). Η μισοπροστόλη δεν συστήνεται. Μηχανικές μέθοδοι ως εναλλακτική.",
"Τοκετός σε μονάδα με δυνατότητα άμεσης καισαρικής και ανάνηψης νεογνού, με συνεχές ΚΤΓ. Όχι κολπικός τοκετός στο σπίτι."]};
S["54β"]={d:"Φεβρουάριος 2023",b:[
"Συμπληρωματική της Νο 54, βασισμένη στη μελέτη ARRIVE και μεταγενέστερες μετα-αναλύσεις.",
"Σε χαμηλού κινδύνου πρωτότοκες, η πρόκληση στις 39+0–39+4 μείωσε τις καισαρικές (18,6% έναντι 22,2%) και τις υπερτασικές διαταραχές σε σύγκριση με την αναμονή.",
"ACOG και SMFM θεωρούν λογική επιλογή την πρόκληση μετά τις 39+0 σε πρωτότοκες με ανεπίπλεκτη κύηση.",
"Συμπέρασμα: η πρόκληση από 39+0 σε ανεπίπλεκτη μονήρη κύηση με τεκμηριωμένη ηλικία κύησης δεν συνδέεται με χειρότερη περιγεννητική έκβαση ούτε με περισσότερες καισαρικές.",
"Λαμβάνονται υπόψη οι προτιμήσεις της εγκύου, το διαθέσιμο προσωπικό και οι συνθήκες της μονάδας."]};
S["63"]={d:"Νοέμβριος 2022",b:[
"Βαρύτητα με PUQE: >13 σοβαρή, 7–12 μέτρια, <6 ήπια. Υψηλό σκορ → έλεγχος για υπογκαιμία και ηλεκτρολύτες.",
"Πρόληψη: πολυβιταμίνες ένα μήνα πριν τη σύλληψη· μικρά συχνά γεύματα ανά 1–2 ώρες, πλούσια σε πρωτεΐνη· αποφυγή ερεθισμάτων.",
"Ήπια συμπτώματα: τζίντζερ 250 mg 4 φορές ημερησίως.",
"1η γραμμή: πυριδοξίνη με δοξυλαμίνη.",
"2η γραμμή: μετοκλοπραμίδη (έως 5 ημέρες), ονδανσετρόνη (IV έως 16 mg· συμβουλευτική πριν τις 10 εβδομάδες), δομπεριδόνη ή διφαινυδραμίνη.",
"3η γραμμή/νοσηλεία: IV υγρά με θειαμίνη (B1) και μετοκλοπραμίδη ή ονδανσετρόνη.",
"Ανθεκτικές περιπτώσεις: μεθυλπρεδνιζολόνη 16 mg × 3/ημέρα για 3 ημέρες· διακοπή αν δεν υπάρξει βελτίωση σε 72 ώρες· μέγιστη διάρκεια 6 εβδομάδες."]};
S["64"]={d:"Ιανουάριος 2024",b:[
"Έναρξη παρακολούθησης στο 1ο τρίμηνο, ιδανικά πριν τις 10 εβδομάδες.",
"Υπερηχογράφημα 11+0–13+6: χρονολόγηση, χοριονικότητα, αδρή ανατομία, έλεγχος τρισωμιών 21, 18, 13. Λεπτομερές ανατομικό στις 20–23 εβδομάδες.",
"Διχοριακές: ανάπτυξη στις 28, 32, 36 εβδομάδες· τοκετός στις 37+0–37+6.",
"Μονοχοριακές διαμνιακές: έλεγχος ανά 2 εβδομάδες από τις 16 εβδομάδες με Doppler (ομφαλική, ΜΕΑ, φλεβώδης πόρος)· καισαρική στις 36+0–36+6.",
"Μονοχοριακές μονοαμνιακές: καισαρική στις 32+0–33+6.",
"Ασπιρίνη 150 mg ημερησίως από τις 12 εβδομάδες με ≥1 παράγοντα κινδύνου προεκλαμψίας.",
"Μήκος τραχήλου στις 18–23 εβδομάδες· αν ≤25 mm, προγεστερόνη 200 mg κολπικά."]};
S["65"]={d:"Ιανουάριος 2024",b:[
"Ορισμός: γέννηση χωρίς σημεία ζωής μετά την 22η εβδομάδα (παλαιότερα 24η).",
"Διάγνωση με υπερηχογράφημα· Doppler, στηθοσκόπιο και ΚΤΓ δεν επαρκούν.",
"Ο κίνδυνος ΔΕΠ και λοίμωξης είναι μικρός έως ~48 ώρες· αν η αναμονή παραταθεί, έλεγχος ΔΕΠ 2 φορές/εβδομάδα. Άμεσος τοκετός σε προεκλαμψία, σήψη, αποκόλληση, ρήξη υμένων ή ενδείξεις ΔΕΠ.",
"Πρόκληση με κολπική μισοπροστόλη (προτιμάται)· μιφεπριστόνη 200 mg 24–48 ώρες πριν μειώνει τον χρόνο κατά ~7 ώρες.",
"Μία προηγούμενη καισαρική: πρόκληση ασφαλής (κολπικός τοκετός 91%, ρήξη 0,7%)· δύο τομές: ρήξη ~0,9%.",
"Μικροσυστοιχίες εμβρύου και πλακούντα σε όλες· αυτοψία σε όλες μετά από γραπτή συναίνεση.",
"Όχι ρουτίνα αντιβιοτικά (ακόμη και GBS θετικές), εκτός σήψης. Το θνησιγενές μόνο του δεν είναι ένδειξη θρομβοπροφύλαξης.",
"Αναστολή γαλουχίας με καβεργολίνη (προτιμάται της βρωμοκρυπτίνης)· αντένδειξη η υπέρταση."]};
S["67"]={d:"Ιανουάριος 2025",b:[
"Η ΕΜΓΕ θεωρεί το μαιευτήριο ή νοσοκομείο ασφαλέστερο τόπο τοκετού με τα σημερινά δεδομένα.",
"Απαιτείται εκπαιδευμένος και πιστοποιημένος μαιευτήρας ή μαία με εξοπλισμό και άμεση πρόσβαση σε μαιευτήριο.",
"Κριτήρια χαμηλού κινδύνου: ηλικία >18 και <40, μονήρης κεφαλική, 37–40+6 εβδομάδες, 1ος–4ος τόκος, αυτόματη έναρξη, ΔΜΣ 18–35, Hb ≥10 g/dl στις 36 εβδ., υπερηχογραφήματα 18–22 και 32–36 εβδ.",
"Αντενδείξεις: πολύδυμη, προδρομικός, ανώμαλη προβολή, προεκλαμψία/υπέρταση, πρόκληση, αποκόλληση, Hb <8,5 g/dl στην έναρξη, ρήξη υμένων >24 ωρών.",
"Έλεγχος χώρου πριν τις 36 εβδομάδες και σχέδιο μεταφοράς· γραπτή ενημέρωση και συναίνεση.",
"Μεταφορά σε κάθε απόκλιση από τον φυσιολογικό τοκετό (π.χ. κεχρωσμένο αμνιακό, μη καθησυχαστική ακρόαση, πυρετός, υπέρταση, νεογνό <2.500 g).",
"Κέντρα φυσικού τοκετού: μαιοκεντρικό μοντέλο, χωρίς επισκληρίδιο· οι υψηλού κινδύνου τοκετεύουν σε νοσοκομείο."]};
S["69"]={d:"Μάρτιος 2025",b:[
"Σε αμφιβολία για την έκταση, η ρήξη ταξινομείται στον μεγαλύτερο βαθμό. Η ρήξη βλεννογόνου ορθού με άθικτο σφιγκτήρα είναι ξεχωριστή κατηγορία («κουμπότρυπα»).",
"Περινεοτομή επιλεκτικά, όχι ρουτίνα· μεσοπλάγια με γωνία 45–60° από τη μέση γραμμή.",
"Προστασία: υποστήριξη περινέου, ελεγχόμενη έξοδος κεφαλής, θερμές κομπρέσες, μασάζ.",
"Μετά από κάθε κολπικό τοκετό λεπτομερής εξέταση με δακτυλική από το ορθό.",
"Συρραφή με απορροφήσιμα 3-0 ή 2-0 (PDS ή Vicryl). Πρώτα ο βλεννογόνος του ορθού (4ος βαθμός)· ο έσω σφιγκτήρας χωριστά (3γ). Ολική ρήξη έξω σφιγκτήρα: τελικοτελική ή εφίππευση· μερική: τελικοτελική.",
"Μετά: αντιβιοτικά, λακτουλόζη για ~10 ημέρες, επανεκτίμηση σε 6–12 εβδομάδες· φυσικοθεραπεία σε ακράτεια.",
"Επόμενη κύηση: συζήτηση καισαρικής έναντι κολπικού τοκετού (επιδείνωση εγκράτειας 17%, νέα ρήξη 5–7%)."]};
S["59"]={d:"Ιούνιος 2021",b:[
"mWHO II–III, III, IV: παρακολούθηση από ομάδα με αναισθησιολόγο, μαιευτήρα και καρδιολόγο εξειδικευμένους σε κυήσεις υψηλού κινδύνου.",
"Σχέδιο τοκετού έως την 30ή εβδομάδα, καταγεγραμμένο στον φάκελο.",
"Πρόκληση με μαιευτική ή καρδιολογική ένδειξη και σε κάθε περίπτωση έως 39+6.",
"Οι περισσότερες καρδιοπάθειες δεν αποτελούν ένδειξη καισαρικής· ο κολπικός τοκετός έχει λιγότερη αιμορραγία, λοίμωξη και ΦΘΕ.",
"Μηχανική βαλβίδα: χαμηλή δόση ΑΒΚ (ασενοκουμαρόλη ≤2 mg ή βαρφαρίνη ≤5 mg) μπορεί να συνεχιστεί στο 1ο τρίμηνο με INR ανά 1–2 εβδομάδες· υψηλή δόση αντικαθίσταται με ηπαρίνη στις 6–12 εβδ. Διακοπή ΑΒΚ στις 36 εβδομάδες.",
"Εμβρυϊκή καρδιά στις 11+0–13+6 και 18–22 εβδομάδες· ανάπτυξη και Doppler στις 30–32.",
"Περιγεννητική μυοκαρδιοπάθεια: αγωγή ≥12 μήνες μετά την αποκατάσταση του κλάσματος εξώθησης.",
"Θηλασμός επιτρέπεται στις περισσότερες καρδιοπάθειες (όχι σε μεταμόσχευση με ανοσοκαταστολή ή ΚΑ NYHA III–IV με μειωμένο ΚΕ). Υποβοηθούμενη αναπαραγωγή αντενδείκνυται σε mWHO IV."]};
S["35"]={d:"Μάιος 2020",b:[
"Πριν την κύηση: HbA1c <6,5% και νηστεία 80–110 mg/dl, με βελτιστοποίηση για ≥6 μήνες.",
"Φυλλικό οξύ 5 mg ημερησίως για 3 μήνες πριν τη σύλληψη έως το τέλος της 12ης εβδομάδας, μετά 0,4 mg έως τον απογαλακτισμό.",
"Ασπιρίνη 160 mg το βράδυ έως την 36η εβδομάδα.",
"Αυτοέλεγχος ≥7 φορές/ημέρα· στόχοι: νηστεία ≤95, 60 λεπτά ≤140, 120 λεπτά ≤120 mg/dl.",
"Ινσουλίνη: περίπου 0,7 / 0,8 / 0,9 IU/kg/ημέρα ανά τρίμηνο· lispro ή aspart με NPH ή detemir, όχι έτοιμα μείγματα.",
"Ενδοκρινολογικός έλεγχος ανά 1–2 εβδομάδες μαζί με μαιευτήρα κυήσεων υψηλού κινδύνου.",
"Τοκετός 36+0–38+6 σε κακή ρύθμιση (μακροσωμία, υδράμνιο)· έως 40+0 μόνο με καλή ρύθμιση και ανάπτυξη. Καισαρική αν ΕΒΕ ≥4.500 g στις 38–39 εβδ. ή εμβρυϊκή δυσπραγία.",
"Κατά τον τοκετό D/W 5% 125 ml/h, στόχος γλυκόζης 80–130 mg/dl. Μετά: ενθάρρυνση θηλασμού· τα συνδυασμένα αντισυλληπτικά αντενδείκνυνται."]};
S["70"]={d:"Φεβρουάριος 2025",b:[
"Υπερηχογράφημα αρχόμενης κύησης έως 10+6 εβδομάδες· όχι απαραίτητο σε ομαλή κύηση χωρίς ειδική ένδειξη.",
"Υπερηχογράφημα 11+0–13+6 (CRL 45–84 mm) σε όλες τις εγκύους.",
"Διάγνωση αποβολής: CRL ≥7 mm χωρίς καρδιακή λειτουργία ή σάκος μέσης διαμέτρου ≥25 mm χωρίς εμβρυϊκό πόλο· μικρότερες τιμές → επανέλεγχος σε 7–10 ημέρες.",
"Χαμηλή κύηση πέριξ ουλής καισαρικής: άμεση παραπομπή σε εξειδικευμένο υπερηχογραφιστή.",
"CRL >84 mm: δεν υπολογίζεται κίνδυνος τρισωμίας από την ΑΔ· συζήτηση εναλλακτικών (π.χ. cfDNA).",
"Η ηλικία κύησης ορίζεται από το CRL του 1ου τριμήνου και δεν αλλάζει· σε αυτόματη πολύδυμη από το μεγαλύτερο έμβρυο.",
"ΑΔ με βιοχημικό: ανίχνευση ~90% της Τ21 με ~5% ψευδώς θετικά (~95% και ~3% με δευτερεύοντες δείκτες). Από πιστοποιημένο ιατρό.",
"~40% των σοβαρών ανατομικών ανωμαλιών διαγιγνώσκονται στις 11–13+6· δεν αντικαθιστά το ανατομικό των 20–24 εβδομάδων.",
"Ενυπόγραφη γραπτή γνωμάτευση με εικόνες, φύλαξη 10 έτη."]};
S["72"]={d:"Αύγουστος 2025",b:[
"Ρουτινικό υπερηχογράφημα 3ου τριμήνου στις 32–36 εβδομάδες (νωρίτερα καλύτερη ανατομία, κοντά στις 36 καλύτερη ανίχνευση SGA/FGR/LGA).",
"ΕΒΕ με Hadlock-3 (HC-AC-FL)· επανεκτίμηση ανά ≥2, κατά προτίμηση 3 εβδομάδες· απόκλιση 10–20%.",
"Αξιολόγηση με εκατοστιαίες θέσεις (καμπύλη Hadlock), όχι με αντιστοιχία σε εβδομάδες.",
"Ορισμοί: AGA 10η–90ή ΕΘ· SGA <10η· FGR <3η ή 3η–10η με παθολογικό Doppler/πλακουντιακή ανεπάρκεια· LGA >90ή.",
"Διερεύνηση αν πλάγιες κοιλίες ≥10 mm, λόγος ΔΚ:ΑΚ ≥1,4, διάταση πυέλου >7 mm. Το 25% των συγγενών ανωμαλιών διαγιγνώσκεται στο 3ο τρίμηνο.",
"Χαμηλός πλακούντας: ≤2 cm από τον έσω τραχηλικό στόμιο. Στοχευμένος έλεγχος (διακολπικά, έγχρωμο Doppler) για προδρομικά αγγεία σε χαμηλό πλακούντα ή προηγούμενη τομή.",
"Ολιγάμνιο AFI <5 cm ή DVP <2 cm· υδράμνιο AFI >24 (ή >25) cm ή DVP >8 cm· και τα δύο απαιτούν λεπτομερή έλεγχο ανατομίας και αύξησης."]};
S["73"]={d:"Αύγουστος 2025",b:[
"Γραπτή ενημέρωση του εργαστηρίου για τον εμβρυϊκό φαινότυπο (υπερηχογράφημα, MRI, οικογενειακό ιστορικό) πριν την ανάλυση.",
"Ισχυρή σύσταση για ανάλυση trio (έμβρυο και γονείς).",
"Η WES προτιμάται της CES· η WGS δεν συνιστάται προς το παρόν.",
"Αναφέρονται μόνο παθογόνες και πιθανώς παθογόνες παραλλαγές σχετικές με τον φαινότυπο· όχι VUS εκτός από διεπιστημονική απόφαση.",
"Προϋπόθεση: προηγούμενος ή ταυτόχρονος μοριακός καρυότυπος. Ενδείξεις: πολλαπλές ανωμαλίες, μείζονες ανωμαλίες ΚΝΣ ή καρδιάς, ηχογενείς νεφροί, ΑΔ >4 mm.",
"Δεν αποτελούν ένδειξη: soft markers, ανεξήγητο ολιγάμνιο/υδράμνιο, μεμονωμένες ανοικτές βλάβες νευρικού σωλήνα, αμνιακές ταινίες, γονεϊκή επιθυμία.",
"Υπογεγραμμένη συναίνεση (αποτελέσματα συνήθως σε 3–4 εβδομάδες) και συμβουλευτική μετά το αποτέλεσμα. Εργαστήριο διαπιστευμένο κατά ISO 15189."]};
S["74"]={d:"Αύγουστος 2025",b:[
"Υπερηχογράφημα αυχενικής διαφάνειας στις 11–13 εβδομάδες σε όλες, ανεξάρτητα από cfDNA, από ειδικό ή πιστοποιημένο ιατρό με πιστοποιημένο λογισμικό.",
"Γραπτή συμβουλευτική μετά το υπερηχογράφημα· εξατομικευμένη συζήτηση επιλογών (κανένας έλεγχος, cfDNA, επεμβατικός).",
"cfDNA μόνο μετά το υπερηχογράφημα 11–13 εβδομάδων. Είναι εξέταση screening· το θετικό απαιτεί επιβεβαίωση με επεμβατική μέθοδο.",
"Μετά από cfDNA χαμηλού κινδύνου, επεμβατικός έλεγχος μόνο σε αυξημένη ΑΔ ή αυχενική πτυχή, ανωμαλίες, πολλαπλούς δείκτες ή δείκτες άλλης παθολογίας πέραν της Τ21.",
"Ο κίνδυνος αποβολής από αμνιοπαρακέντηση ή CVS είναι πολύ χαμηλός.",
"Δίδυμες: το cfDNA έχει υψηλή ακρίβεια για Τ21 και Τ18 ανεξαρτήτως χοριονικότητας. Δεν υποστηρίζεται για υπομικροσκοπικές ανωμαλίες."]};
S["71"]={d:"Φεβρουάριος 2025",b:[
"Συμβουλές υγιεινής σε όλες τις εγκύους (αποφυγή σάλιου/ούρων μικρών παιδιών, πλύσιμο χεριών).",
"Οροαρνητικές: έλεγχος όσο νωρίτερα, επανάληψη κάθε 4 εβδομάδες έως τις 14–16 εβδομάδες· όχι μετά τις 16 εκτός υπερηχογραφικής υποψίας.",
"Θετικό IgM: IgG avidity για αποκλεισμό πρωτοπαθούς λοίμωξης <90 ημερών· επανάληψη σε ενδιάμεση τιμή.",
"Πρωτοπαθής λοίμωξη περί τη σύλληψη ή στο 1ο τρίμηνο: βαλακυκλοβίρη 8 g/ημέρα από το στόμα (2 g × 4) μέχρι το αποτέλεσμα της αμνιοπαρακέντησης.",
"Υπεράνοση σφαιρίνη 100 IU/kg/4 εβδομάδες δεν συνιστάται· 200 IU/kg/2 εβδομάδες ίσως σε πολύ πρόσφατη λοίμωξη 1ου τριμήνου.",
"CMV PCR αμνιακού υγρού από 17+0 εβδομάδες και ≥8 εβδομάδες μετά τη μητρική λοίμωξη.",
"Επιβεβαιωμένη εμβρυϊκή λοίμωξη: σειριακό υπερηχογράφημα ή MRI· βαλακυκλοβίρη επιλογή μετά από διεπιστημονική συζήτηση. Αρνητική αμνιοπαρακέντηση: διακοπή θεραπείας."]};
S["75"]={d:"Αύγουστος 2025",b:[
"Γρίπη: αδρανοποιημένο εμβόλιο σε κάθε έγκυο, σε οποιοδήποτε τρίμηνο.",
"Tdap: μία δόση σε κάθε κύηση, ιδανικά 27–36 εβδομάδες· αν παραλειφθεί, στη λοχεία.",
"RSV (RSVpreF): μία δόση στις 32–36 εβδομάδες, κυρίως Σεπτέμβριο–Μάρτιο. Nirsevimab στο νεογνό αν γεννηθεί <14 ημέρες μετά τον εμβολιασμό ή <34 εβδομάδες.",

S["48"]={d:"Μάρτιος 2021",b:[
"CIN1: συνήθως όχι θεραπεία· θεραπεία αν επιμένει ≥2 έτη. <25 ετών: επανάληψη κυτταρολογίας σε 1 έτος.",

S["49"]={d:"Ιούνιος 2021",b:[
"1η επίσκεψη: τεστ Παπανικολάου (και HPV αν δεν υπάρχει πρόσφατος ή φυσιολογικός έλεγχος <1 έτους)· HPV DNA σε έγκυες ≥35 ετών.",
"Κολποσκόπηση ιδανικά έως 13–14 εβδομάδες από έμπειρο γυναικολόγο· σε HSIL επανέλεγχος στις 28–30 εβδομάδες.",
"Μετά τον τοκετό: LSIL σε 3–6 μήνες, HSIL σε 6–8 εβδομάδες, AIS σε 10–14 ημέρες.",
"Διηθητικός καρκίνος: ογκολογικό συμβούλιο, καισαρική ιδανικά στις 34–35 εβδομάδες. Στάδιο ΙΑ1: κωνοειδής εκτομή.",
"HPV θετική ή παθολογικό επίχρισμα: κολπικός τοκετός· καισαρική μόνο για απόφραξη, αιμορραγία ή καρκίνο.",
"Όχι εμβολιασμός HPV στην κύηση· χορήγηση σε μη διαγνωσμένη κύηση δεν αποτελεί ένδειξη διακοπής. Όχι καθολικός έλεγχος HPV στις εγκύους."]};
S["50"]={d:"Μάρτιος 2021",b:[
"Η VaIN αφορά κυρίως γυναίκες >50 ετών.",

S["51"]={d:"Ιούλιος 2021",b:[

S["82"]={d:"Μάρτιος 2026",b:[

const FB_CFG={apiKey:"AIzaSyA8xnfwG9iwCDi8QWilaHoyj5UWove7SEE",authDomain:"odigies-mg.firebaseapp.com",projectId:"odigies-mg",storageBucket:"odigies-mg.firebasestorage.app",messagingSenderId:"505988184846",appId:"1:505988184846:web:7078b8d3d1ac6ddc15f55f"};

const b64e=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pass,uid){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt:new TextEncoder().encode("odigies-mg:"+uid),iterations:310000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["encrypt","decrypt"])}
async function encJ(obj){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},cloud.key,new TextEncoder().encode(JSON.stringify(obj)));return {iv:b64e(iv),ct:b64e(ct)}}
async function decJ(d){const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(d.iv)},cloud.key,b64d(d.ct));return JSON.parse(new TextDecoder().decode(pt))}
const pHash=p=>JSON.stringify(Object.assign({},p,{upd:0}));
const fbErr=e=>{const c=(e&&e.code)||"";return ({"auth/invalid-credential":"Λάθος email ή κωδικός.","auth/wrong-password":"Λάθος κωδικός.","auth/user-not-found":"Δεν υπάρχει λογαριασμός με αυτό το email.","auth/email-already-in-use":"Υπάρχει ήδη λογαριασμός με αυτό το email· πατήστε «Σύνδεση».","auth/weak-password":"Ο κωδικός πρέπει να έχει τουλάχιστον 6 χαρακτήρες.","auth/invalid-email":"Μη έγκυρο email.","auth/too-many-requests":"Πολλές προσπάθειες· δοκιμάστε σε λίγο.","auth/network-request-failed":"Δεν υπάρχει σύνδεση στο διαδίκτυο.","permission-denied":"Άρνηση πρόσβασης."})[c]||("Σφάλμα: "+(c||e&&e.message||e))};
async function fbInit(){
  if(FB||!CLOUD_OK)return FB;
  try{
    const [A,U,S]=await Promise.all([import(FBU("app")),import(FBU("auth")),import(FBU("firestore"))]);
    const app=A.initializeApp(FB_CFG);
    FB={U,S,auth:U.getAuth(app),db:S.getFirestore(app)};
    U.onAuthStateChanged(FB.auth,async u=>{
      cloud.user=u;cloud.key=null;cloud.hasCheck=null;if(cloud.unsub){cloud.unsub();cloud.unsub=null}
      if(!u){cloud.st="out";cloudRerender();return}
      cloud.st="locked";
      const raw=store.get("mg-ckey-"+u.uid,null);
      if(raw){try{cloud.key=await crypto.subtle.importKey("raw",b64d(raw),{name:"AES-GCM"},true,["encrypt","decrypt"]);await cloudStart();return}catch(_){store.set("mg-ckey-"+u.uid,null)}}
      try{const c=await S.getDoc(S.doc(FB.db,"users",u.uid,"meta","check"));cloud.hasCheck=c.exists()}catch(e){cloud.msg=fbErr(e)}
      cloudRerender();

async function cloudUnlock(){
  const p1=($("#c_k1")||{}).value||"",p2=($("#c_k2")||{}).value;
  if(p1.length<8){cloud.msg="Ο κωδικός κρυπτογράφησης πρέπει να έχει τουλάχιστον 8 χαρακτήρες.";render();return}
  if(cloud.hasCheck===false&&p1!==p2){cloud.msg="Οι δύο κωδικοί δεν ταιριάζουν.";render();return}
  cloud.busy=true;cloud.msg="";render();
  try{
    const u=cloud.user,S=FB.S;cloud.key=await deriveKey(p1,u.uid);
    const ref=S.doc(FB.db,"users",u.uid,"meta","check");const c=await S.getDoc(ref);
    if(c.exists()){try{const v=await decJ(c.data());if(v!=="ok")throw 0}catch(_){cloud.key=null;cloud.busy=false;cloud.msg="Λάθος κωδικός κρυπτογράφησης.";render();return}}
    else await S.setDoc(ref,await encJ("ok"));
    store.set("mg-ckey-"+u.uid,b64e(await crypto.subtle.exportKey("raw",cloud.key)));
    await cloudStart();
  }catch(e){cloud.key=null;cloud.msg=fbErr(e)}
  cloud.busy=false;render();
}
async function cloudStart(){
  const u=cloud.user,S=FB.S;cloud.st="sync";cloudRerender();
  const col=S.collection(FB.db,"users",u.uid,"patients");
  cloud.unsub=S.onSnapshot(col,async snap=>{
    let changed=false;
    for(const ch of snap.docChanges()){
      const id=ch.doc.id,d=ch.doc.data(),i=PREG.findIndex(p=>p.id===id),loc=i>-1?PREG[i]:null;
      if(ch.type==="removed")continue;
      if(d.del){if(loc&&(loc.upd||0)<=d.upd){PREG.splice(i,1);changed=true}cloud.synced[id]="del";continue}
      if(loc&&(loc.upd||0)>=d.upd){continue}
      try{const p=await decJ(d);p.upd=d.upd;if(i>-1)PREG[i]=p;else PREG.push(p);cloud.synced[id]=pHash(p);changed=true}catch(_){}
    }
    if(changed){store.set("mg-preg",PREG);cloudRerender()}
    if(cloud.st!=="ok"){cloud.st="ok";cloudPush();cloudRerender()}
  },e=>{cloud.st="err";cloud.msg=fbErr(e);cloudRerender()});
}

  if(cloud.st!=="ok"||!cloud.key)return;const u=cloud.user,S=FB.S;

    for(const p of PREG){const h=pHash(p);if(cloud.synced[p.id]===h)continue;p.upd=Date.now();await S.setDoc(S.doc(FB.db,"users",u.uid,"patients",p.id),Object.assign(await encJ(p),{upd:p.upd}));cloud.synced[p.id]=h}

  const st=e.target.closest("[data-stg]"); if(st){const [n,j]=st.dataset.stg.split(":");stgSel[n]=+j;render();return}
  const fm=e.target.closest("[data-fmode]"); if(fm){fMode=fm.dataset.fmode;store.set("mg-fmode",fMode);render();return}
  const curF=()=>byF[route().slice(2)];
  const fp=e.target.closest("[data-fpick]"); if(fp){const f=curF(),s=fsOf(f);const [i,bi]=fp.dataset.fpick.split(":").map(Number);s.p[i]=bi;for(const k in s.p)if(+k>i)delete s.p[k];render();setTimeout(()=>{const a=$(".wz-ans");if(a)a.scrollIntoView({behavior:"smooth",block:"nearest"})},30);return}
  const dp=e.target.closest("[data-dpick]"); if(dp){const s=fsOf(curF());const [i,bi]=dp.dataset.dpick.split(":").map(Number);s.d[i]=s.d[i]===bi?null:bi;render();return}
  const fn=e.target.closest("[data-fnext]"); if(fn){const s=fsOf(curF());s.i++;render();const w=$(".wz");if(w)w.scrollIntoView({behavior:"smooth",block:"start"});return}
  const fv=e.target.closest("[data-fprev]"); if(fv){const s=fsOf(curF());s.i=Math.max(0,s.i-1);render();return}
  const fst=e.target.closest("[data-fstep]"); if(fst){const s=fsOf(curF());s.i=+fst.dataset.fstep;render();return}
  const fr=e.target.closest("[data-freset]"); if(fr){const f=curF();FS[f.id]={i:0,p:{},d:{}};render();return}
  const fsu=e.target.closest("[data-fsum]"); if(fsu){const txt=flowSummary(curF());const ok=()=>{fsu.innerHTML="Αντιγράφηκε ✓"};try{navigator.clipboard.writeText(txt).then(ok,()=>{fsu.textContent="Μη διαθέσιμο"})}catch(_){fsu.textContent="Μη διαθέσιμο"}return}
  const pk=e.target.closest("[data-pick]"); if(pk&&!e.target.closest("a")){const dec=pk.closest(".dec");const was=pk.classList.contains("pick");dec.querySelectorAll(".br").forEach(x=>x.classList.remove("pick"));if(was)dec.classList.remove("picked");else{pk.classList.add("pick");dec.classList.add("picked")}return}
  const cp=e.target.closest("[data-copy]"); if(cp){const n=cp.closest(".node,.wz-card,.dg-card");const txt=n.querySelector("h2,h3").textContent+"\n"+[...n.querySelectorAll("li")].map(l=>"• "+l.textContent).join("\n");const done=()=>{cp.textContent="Αντιγράφηκε ✓";setTimeout(()=>cp.textContent="Αντιγραφή",1500)};try{navigator.clipboard.writeText(txt).then(done,()=>{cp.textContent="Μη διαθέσιμο"})}catch(_){cp.textContent="Μη διαθέσιμο"}return}
  const sh=e.target.closest("[data-share]"); if(sh){const url=location.href,title=document.title;if(navigator.share){navigator.share({title,url}).catch(()=>{})}else{try{navigator.clipboard.writeText(url).then(()=>{sh.lastChild.textContent=" Ο σύνδεσμος αντιγράφηκε"})}catch(_){}}return}
  const gv=e.target.closest("[data-gview]"); if(gv){gView=gv.dataset.gview;store.set("mg-gview",gView);render();return}
  const ak=e.target.closest("[data-ask]"); if(ak){ask(ak.dataset.ask);return}
  const mc=e.target.closest("[data-mic]"); if(mc){micToggle();return}
  const hm=e.target.closest("[data-homemic]"); if(hm){e.stopPropagation();location.hash="rotiste";render();micToggle();return}
  const nc=e.target.closest("[data-newchat]"); if(nc){chat=[];hist=[];render();setTimeout(()=>$("#askq")&&$("#askq").focus(),30);return}
  const hw=e.target.closest("[data-howto]"); if(hw){store.set("mg-howto",false);render();return}
  const f=e.target.closest("[data-fav]"); if(f){e.preventDefault();e.stopPropagation();toggleFav(f.dataset.fav);return}
  const c=e.target.closest("[data-cat]"); if(c){state.cat=c.dataset.cat;state.q="";go("odigies");render();return}
  const b=e.target.closest("[data-back]"); if(b){history.length>1?history.back():go("home");return}
  const g=e.target.closest("[data-go]"); if(g){e.preventDefault();closePal();go(g.dataset.go)}
});
document.addEventListener("change",e=>{if(e.target.id==="sort"){state.sort=e.target.value;render()}if(e.target.id==="old"){state.old=e.target.checked;render()}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.target.classList.contains("row")||e.target.hasAttribute("data-pick")))e.target.click()});
addEventListener("hashchange",render);
addEventListener("scroll",()=>$("#topbar").classList.toggle("scrolled",scrollY>4),{passive:true});

/* palette */
let pSel=0,pItems=[];
function openPal(q){$("#pal").classList.add("open");$("#pq").value=q||"";pRender();setTimeout(()=>$("#pq").focus(),20)}
function closePal(){$("#pal").classList.remove("open")}
function pRender(){
  const q=$("#pq").value,ts=terms(q);pItems=[];let h="";
  if(!ts.length){
    h+=`<div class="pg">Αλγόριθμοι</div>`+F.map(f=>{pItems.push("f-"+f.id);return pRow("f",f,[])}).join("");
  }else{
    const fl=F.filter(f=>match(f.idx,ts));
    const gl=G.filter(g=>match(g.idx,ts)).sort((a,b)=>(a.old||0)-(b.old||0)||(norm(b.t).includes(ts[0])-norm(a.t).includes(ts[0]))||b.s-a.s);
    const dl=[];doses.forEach(d=>d.l.forEach(l=>{if(match(norm(l),ts))dl.push({g:d.g,l})}));
    if(fl.length) h+=`<div class="pg">Αλγόριθμοι</div>`+fl.map(f=>{pItems.push("f-"+f.id);return pRow("f",f,ts)}).join("");
    if(dl.length) h+=`<div class="pg">Δόσεις</div>`+dl.slice(0,6).map(d=>{pItems.push("g-"+slug(d.g.n));return `<div class="pi" data-go="g-${slug(d.g.n)}"><div class="num">${esc(d.g.n)}</div><div style="min-width:0"><div class="ps" style="color:var(--ink);font-size:13.5px">${hl(d.l,ts)}</div></div></div>`}).join("");
    if(gl.length) h+=`<div class="pg">Οδηγίες</div>`+gl.slice(0,12).map(g=>{pItems.push("g-"+slug(g.n));const s=S[g.n];const hit=s?s.b.find(b=>ts.some(t=>norm(b).includes(t))):"";return `<div class="pi" data-go="g-${slug(g.n)}"><div class="num">${esc(g.n)}</div><div style="min-width:0"><div class="pt">${hl(g.t,ts)}${g.old?` <span class="tag sup">παλαιά</span>`:""}</div>${hit?`<div class="ps">${hl(hit,ts)}</div>`:""}</div></div>`}).join("");
    if(!pItems.length) h=`<div class="empty">Δεν βρέθηκαν αποτελέσματα για «${esc(q)}».</div>`;
  }
  $("#pres").innerHTML=h;pSel=0;pMark();
}
function pRow(t,f,ts){return `<div class="pi" data-go="f-${f.id}"><div class="ico">${svg("flow")}</div><div style="min-width:0"><div class="pt">${hl(f.t,ts)}</div><div class="ps">${esc(f.sub)}</div></div></div>`}
function pMark(){[...document.querySelectorAll("#pres .pi")].forEach((el,i)=>el.classList.toggle("sel",i===pSel));const s=document.querySelector("#pres .pi.sel");if(s)s.scrollIntoView({block:"nearest"})}
$("#pq").addEventListener("input",pRender);
$("#pq").addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"){e.preventDefault();pSel=Math.min(pSel+1,pItems.length-1);pMark()}
  else if(e.key==="ArrowUp"){e.preventDefault();pSel=Math.max(pSel-1,0);pMark()}
  else if(e.key==="Enter"&&pItems[pSel]){closePal();go(pItems[pSel])}
});
$("#openPal").onclick=()=>openPal("");
$("#pclose").onclick=closePal;
$("#pal").addEventListener("click",e=>{if(e.target.id==="pal")closePal()});
document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openPal("")}
  else if(e.key==="/"&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();openPal("")}
  else if(e.key==="Escape")closePal();
});

render();
if("serviceWorker" in navigator&&/github\.io$/.test(location.hostname)){try{
  const hadCtl=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>{r.update();document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")r.update()})}).catch(()=>{});
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(hadCtl&&!reloaded){reloaded=true;location.reload()}});
}catch(e){}}
</script>
</body>
</html>
